---
# The probes: Ansible works inside each probe's xray-pwc-aio container, as abc,
# through xray-pwc-net and the bastion. It brings the release (xray_pwc_release:
# a published one, or "local" from this working tree), the tools that release
# needs, writes the state (links, tunnel, Alloy, relay) and restarts what
# changed. The container itself is started on its host from the compose.yml of
# xray-pwc-net-join.yml; the host is never touched from here.
- name: VPN probes (xray-pwc-aio)
  hosts: probes
  gather_facts: false

  pre_tasks:
    - name: Check share links exist
      ansible.builtin.assert:
        that:
          - probe_links | length > 0
        fail_msg: no links in files/probes/{{ inventory_hostname }}/links.txt
        quiet: true

    - name: Outbound access policy
      ansible.builtin.import_tasks: tasks/outbound-policy.yml

    - name: Wait for the container
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: Gather facts
      ansible.builtin.setup:
        gather_subset: [min]

  handlers:
    # A restart of connect-forward or of the tunnel cuts this very connection
    # for a moment: s6-svc only signals, and the next task waits for it.
    - name: Restart connect-forward
      ansible.builtin.command: s6-svc -r /run/service/svc-connect-forward
      notify: Wait for xray-pwc-net

    # New peer settings without taking the interface down. A new address or
    # MTU needs: s6-svc -r /run/service/svc-wg
    - name: Sync xray-pwc-net
      ansible.builtin.command: wg syncconf xray-pwc-net /app/state/wg/xray-pwc-net.conf
      notify: Wait for xray-pwc-net

    - name: Restart probe
      ansible.builtin.command: s6-svc -r /run/service/svc-probe

    - name: Restart alloy
      ansible.builtin.command: s6-svc -r /run/service/svc-alloy

    - name: Restart relay
      ansible.builtin.command: s6-svc -r /run/service/svc-relay

    - name: Restart sshd
      ansible.builtin.command: s6-svc -r /run/service/svc-sshd

    - name: Restart wg
      ansible.builtin.command: s6-svc -r /run/service/svc-wg
      notify: Wait for xray-pwc-net

    - name: Wait for xray-pwc-net
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 120

  tasks:
    - name: Pick the CPU type
      ansible.builtin.set_fact:
        aio_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"

    - name: Read the image version
      ansible.builtin.slurp:
        src: /etc/aio-version
      register: aio_image_slurp

    - name: Read the image's Playwright
      ansible.builtin.slurp:
        src: /etc/aio-playwright-version
      register: aio_image_playwright

    - name: Fetch the bundles
      ansible.builtin.include_tasks:
        file: tasks/release-fetch.yml
        apply:
          delegate_to: localhost
          run_once: true
      vars:
        fetch_arches: "{{ ansible_play_hosts | map('extract', hostvars, 'aio_arch') | unique | sort }}"

    - name: Pick the bundle
      ansible.builtin.set_fact:
        aio_bundle: "{{ xray_pwc_bundles[aio_arch] }}"
        aio_release: "{{ xray_pwc_bundles[aio_arch].env.VERSION }}"
        aio_image_version_now: "{{ aio_image_slurp.content | b64decode | trim }}"

    # A release that needs a newer image cannot reach the probe over
    # xray-pwc-net: only its host can start the new image.
    - name: Check the image is new enough
      ansible.builtin.assert:
        that:
          - aio_image_version_now | regex_replace('-.*$', '') is version(aio_bundle.env.MIN_IMAGE, '>=', version_type='semver')
        fail_msg: >-
          {{ aio_release }} needs the image {{ aio_bundle.env.MIN_IMAGE }} or newer, and
          {{ inventory_hostname }} runs {{ aio_image_version_now }}. Its host's owner sets
          image: {{ aio_image }} in compose.yml and runs docker compose up -d there.
        quiet: true

    - name: Deliver the release
      ansible.builtin.include_tasks: tasks/aio-package.yml
      vars:
        package: { src: "{{ aio_bundle.file }}", dest: "/app/releases/{{ aio_release }}" }
      when: not ansible_check_mode

    # The tools of this release that the image lacks, here in Ansible's /app/opt.
    - name: Find the tools
      ansible.builtin.stat:
        path: "{{ item.image }}"
      loop:
        - { tool: alloy, version: "{{ aio_bundle.env.ALLOY_VERSION }}", image: "/opt/alloy-{{ aio_bundle.env.ALLOY_VERSION }}" }
        - { tool: caddy, version: "{{ aio_bundle.env.CADDY_VERSION }}", image: "/opt/caddy-{{ aio_bundle.env.CADDY_VERSION }}" }
      loop_control:
        label: "{{ item.tool }} {{ item.version }}"
      register: aio_tools_found

    - name: Pick the missing tools
      ansible.builtin.set_fact:
        aio_missing_tools: >-
          {{ aio_tools_found.results | rejectattr('stat.exists') | map(attribute='item')
             | map('combine', {'arch': aio_arch}) | list
             + ([{'tool': 'chromium', 'version': aio_bundle.env.PLAYWRIGHT_VERSION, 'arch': aio_arch}]
                if aio_image_playwright.content | b64decode | trim != aio_bundle.env.PLAYWRIGHT_VERSION else []) }}

    - name: Build the missing tools
      ansible.builtin.command:
        argv: [make, -s, -C, "{{ playbook_dir }}/..", tool, "TOOL={{ item.tool }}", "TOOL_VERSION={{ item.version }}", "ARCH={{ item.arch }}"]
      loop: "{{ ansible_play_hosts | map('extract', hostvars, 'aio_missing_tools') | flatten | unique }}"
      loop_control:
        label: "{{ item.tool }} {{ item.version }} {{ item.arch }}"
      delegate_to: localhost
      run_once: true
      changed_when: false
      when: not ansible_check_mode

    - name: Deliver the missing tools
      ansible.builtin.include_tasks: tasks/aio-package.yml
      vars:
        package:
          src: "{{ xray_pwc_dist }}/tools/{{ item.tool }}-{{ item.version }}-linux-{{ item.arch }}.tar.zst"
          dest: "/app/opt/{{ 'ms-playwright' if item.tool == 'chromium' else item.tool }}-{{ item.version }}"
      loop: "{{ aio_missing_tools }}"
      loop_control:
        label: "{{ item.tool }} {{ item.version }}"
      when: not ansible_check_mode

    - name: Create state directories
      ansible.builtin.file:
        path: /app/state/{{ item }}
        state: directory
        mode: "0700"
      loop: [wg, ssh, alloy, relay]

    - name: Write container settings
      ansible.builtin.template:
        src: templates/probe/aio.env.j2
        dest: /app/state/aio.env
        mode: "0644"
      notify: [Restart wg, Restart connect-forward, Restart relay, Restart sshd]

    - name: Write service links
      ansible.builtin.copy:
        content: "{{ pwc_net_via_links }}"
        dest: /app/state/service_links.txt
        mode: "0600"
      no_log: true
      notify: Restart connect-forward

    - name: Template xray-pwc-net config
      ansible.builtin.template:
        src: templates/probe/wg.conf.j2
        dest: /app/state/wg/xray-pwc-net.conf
        mode: "0600"
      no_log: true
      notify: Sync xray-pwc-net

    - name: Write SSH keys
      ansible.builtin.copy:
        src: "{{ pwc_net_ssh_public_key | expanduser }}"
        dest: /app/state/ssh/authorized_keys
        mode: "0600"

    - name: Write share links
      ansible.builtin.copy:
        content: "{{ probe_links | join('\n') }}\n"
        dest: /app/state/links.txt
        mode: "0600"
      no_log: true
      notify: Restart probe

    - name: Write checker settings
      ansible.builtin.template:
        src: templates/probe/probe.env.j2
        dest: /app/state/probe.env
        mode: "0644"
      notify: Restart probe

    - name: Template alloy config
      ansible.builtin.template:
        src: templates/probe/config.alloy.j2
        dest: /app/state/alloy/config.alloy
        mode: "0644"
      notify: Restart alloy

    - name: Template relay config
      ansible.builtin.template:
        src: templates/probe/Caddyfile.j2
        dest: /app/state/relay/Caddyfile
        mode: "0644"
      notify: Restart relay
      when: aio_relay

    - name: Remove relay config
      ansible.builtin.file:
        path: /app/state/relay/Caddyfile
        state: absent
      notify: Restart relay
      when: not aio_relay

    - name: Switch to the release
      ansible.builtin.shell: |
        set -eu
        new=releases/{{ aio_release }}
        old=$(readlink /app/current || true)
        [ "$old" = "$new" ] && exit 0
        ln -sfn "$new" /app/current.new
        mv -T /app/current.new /app/current
        echo "INFO release_switched from=$(basename "${old:-none}") to={{ aio_release }}" | aio-log deploy >/dev/null
        echo switched
      register: aio_switch
      changed_when: "'switched' in aio_switch.stdout"
      notify: [Restart probe, Restart alloy, Restart relay, Restart sshd, Restart connect-forward, Restart wg]
      when: not ansible_check_mode

    # The current release and the one before stay, for a rollback; tools that
    # no kept release needs go.
    - name: Remove old releases
      ansible.builtin.shell: |
        set -eu
        cd /app/releases
        current=$(basename "$(readlink /app/current)")
        ls -1t | grep -vxF "$current" | tail -n +{{ aio_keep_releases }} | while read -r old; do
          rm -rf "$old"
          echo "INFO release_removed release=$old" | aio-log deploy >/dev/null
          echo "removed $old"
        done
        needed=$(for r in /app/releases/*/release.env; do
          ( . "$r"; echo "alloy-$ALLOY_VERSION"; echo "caddy-$CADDY_VERSION"; echo "ms-playwright-$PLAYWRIGHT_VERSION" )
        done | sort -u)
        for tool in /app/opt/*; do
          [ -d "$tool" ] || continue
          grep -qxF "$(basename "$tool")" <<<"$needed" || { rm -rf "$tool"; echo "removed $tool"; }
        done
      args:
        executable: /bin/bash
      register: aio_prune
      changed_when: aio_prune.stdout | length > 0
      when: not ansible_check_mode
