---
# The probes: Ansible works inside each probe's xray-pwc-aio container, through
# vpnc-net and the bastion. It delivers the code (a release) and the tools,
# writes the state (links, tunnel, Alloy, relay) and restarts what changed.
# The container itself is started on its host from the compose.yml of
# vpnc-net-join.yml.
- name: VPN probes (xray-pwc-aio)
  hosts: probes
  gather_facts: false

  pre_tasks:
    - name: Check share links exist
      ansible.builtin.assert:
        that:
          - probe_links | length > 0
        fail_msg: no links in files/probes/{{ inventory_hostname }}/links.txt
        quiet: true

    - name: Wait for the container
      ansible.builtin.wait_for_connection:
        timeout: 60

    - name: Gather facts
      ansible.builtin.setup:
        gather_subset: [min]

  handlers:
    # A restart of xtc-forward or of the tunnel cuts this very connection for a
    # moment: s6-svc only signals, and the next task waits for the connection.
    - name: Restart xtc-forward
      ansible.builtin.command: s6-svc -r /run/service/svc-xtc-forward
      notify: Wait for vpnc-net

    # New peer settings without taking the interface down. A new address or MTU
    # needs: s6-svc -r /run/service/svc-wg
    - name: Sync vpnc-net
      ansible.builtin.shell: wg syncconf vpnc-net <(wg-quick strip /app/state/wg/vpnc-net.conf)
      args:
        executable: /bin/bash
      notify: Wait for vpnc-net

    - name: Restart pwc
      ansible.builtin.command: s6-svc -r /run/service/svc-pwc

    - name: Restart alloy
      ansible.builtin.command: s6-svc -r /run/service/svc-alloy

    - name: Restart relay
      ansible.builtin.command: s6-svc -r /run/service/svc-relay

    - name: Restart sshd
      ansible.builtin.command: s6-svc -r /run/service/svc-sshd

    - name: Wait for vpnc-net
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 120

  tasks:
    - name: Pick the CPU type
      ansible.builtin.set_fact:
        aio_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"

    - name: Check the image version
      ansible.builtin.slurp:
        src: /etc/aio-version
      register: aio_image_version

    - name: Warn about an old image
      ansible.builtin.debug:
        msg: >-
          The container runs xray-pwc-aio {{ aio_image_version.content | b64decode | trim }},
          the repository has {{ aio_image | split(':') | last }}: on the probe's host, set
          image: {{ aio_image }} in compose.yml, then docker compose up -d.
      when: aio_image_version.content | b64decode | trim != aio_image | split(':') | last

    # The release name: a hash of what goes into it. Same code, same name, nothing rebuilt or resent.
    - name: Hash release sources
      ansible.builtin.shell: >-
        set -o pipefail;
        git ls-files -co --exclude-standard -z -- xray-tun-pwc xray-tun-connect xray-pwc-aio/Dockerfile
        | xargs -0 cat
        | python3 -c 'import hashlib, sys; print(hashlib.sha256(sys.stdin.buffer.read()).hexdigest()[:12])'
      args:
        chdir: "{{ playbook_dir }}/.."
        executable: /bin/bash
      delegate_to: localhost
      run_once: true
      register: aio_release_hash
      changed_when: false
      check_mode: false

    - name: Pick the release
      ansible.builtin.set_fact:
        aio_release: "{{ aio_release_hash.stdout }}"

    - name: Build packages locally
      ansible.builtin.include_tasks: tasks/aio-build.yml
      run_once: true
      vars:
        aio_build_arch: "{{ arch }}"
      loop: "{{ ansible_play_hosts | map('extract', hostvars, 'aio_arch') | unique }}"
      loop_control:
        loop_var: arch
      when: not ansible_check_mode

    - name: Deliver packages
      ansible.builtin.include_tasks: tasks/aio-package.yml
      loop:
        - { file: "release-{{ aio_release }}-{{ aio_arch }}.tar.zst", dest: "/app/releases/{{ aio_release }}" }
        - { file: "alloy-{{ aio_alloy_version }}-{{ aio_arch }}.tar.zst", dest: "/app/opt/alloy-{{ aio_alloy_version }}" }
        - { file: "caddy-{{ aio_caddy_version }}-{{ aio_arch }}.tar.zst", dest: "/app/opt/caddy-{{ aio_caddy_version }}" }
      loop_control:
        loop_var: package
        label: "{{ package.dest }}"
      when: not ansible_check_mode

    - name: Link the tools into the release
      ansible.builtin.file:
        src: "{{ item.src }}"
        dest: /app/releases/{{ aio_release }}/bin/{{ item.name }}
        state: link
        force: true
      loop:
        - { name: alloy, src: "/app/opt/alloy-{{ aio_alloy_version }}/alloy" }
        - { name: caddy, src: "/app/opt/caddy-{{ aio_caddy_version }}/caddy" }
      when: not ansible_check_mode

    # The image has Chromium for its own Playwright. A release with another one
    # gets its browser in the volume, and says where in browsers-path.
    - name: Find the release's Playwright
      ansible.builtin.shell: >-
        /app/releases/{{ aio_release }}/venv/bin/python -c
        'import importlib.metadata as m; print(m.version("playwright"))';
        cat /etc/aio-playwright-version
      register: aio_playwright
      changed_when: false
      when: not ansible_check_mode

    - name: Install the release's browser
      ansible.builtin.command: /app/releases/{{ aio_release }}/venv/bin/python -m playwright install --only-shell chromium
      environment:
        PLAYWRIGHT_BROWSERS_PATH: /app/opt/ms-playwright
      register: aio_browser
      changed_when: aio_browser.stdout is search('downloaded')
      when: not ansible_check_mode and aio_playwright.stdout_lines | unique | length > 1

    - name: Point the release at its browser
      ansible.builtin.copy:
        content: "{{ '/app/opt/ms-playwright' if aio_playwright.stdout_lines | unique | length > 1 else '/ms-playwright' }}\n"
        dest: /app/releases/{{ aio_release }}/browsers-path
        mode: "0644"
      when: not ansible_check_mode

    - name: Create state directories
      ansible.builtin.file:
        path: /app/state/{{ item }}
        state: directory
        mode: "0700"
      loop: [wg, ssh, alloy, relay]

    - name: Write container settings
      ansible.builtin.template:
        src: templates/probe/aio.env.j2
        dest: /app/state/aio.env
        mode: "0644"
      notify: [Restart xtc-forward, Restart relay, Restart sshd]

    - name: Write service links
      ansible.builtin.copy:
        content: "{{ vpnc_net_via_links }}"
        dest: /app/state/service_links.txt
        mode: "0600"
      no_log: true
      notify: Restart xtc-forward

    - name: Template vpnc-net config
      ansible.builtin.template:
        src: templates/probe/wg.conf.j2
        dest: /app/state/wg/vpnc-net.conf
        mode: "0600"
      no_log: true
      notify: Sync vpnc-net

    - name: Write SSH keys
      ansible.builtin.copy:
        src: "{{ vpnc_net_ssh_public_key | expanduser }}"
        dest: /app/state/ssh/authorized_keys
        mode: "0600"

    # The checker runs as abc.
    - name: Write share links
      ansible.builtin.copy:
        content: "{{ probe_links | join('\n') }}\n"
        dest: /app/state/links.txt
        owner: root
        group: abc
        mode: "0640"
      no_log: true
      notify: Restart pwc

    - name: Write checker settings
      ansible.builtin.template:
        src: templates/probe/pwc.env.j2
        dest: /app/state/pwc.env
        mode: "0644"
      notify: Restart pwc

    - name: Template alloy config
      ansible.builtin.template:
        src: templates/probe/config.alloy.j2
        dest: /app/state/alloy/config.alloy
        mode: "0644"
      notify: Restart alloy

    - name: Template relay config
      ansible.builtin.template:
        src: templates/probe/Caddyfile.j2
        dest: /app/state/relay/Caddyfile
        mode: "0644"
      notify: Restart relay
      when: probe_relay

    - name: Remove relay config
      ansible.builtin.file:
        path: /app/state/relay/Caddyfile
        state: absent
      notify: Restart relay
      when: not probe_relay

    - name: Switch to the release
      ansible.builtin.shell: |
        set -eu
        new=releases/{{ aio_release }}
        old=$(readlink /app/current || true)
        [ "$old" = "$new" ] && exit 0
        ln -sfn "$new" /app/current.new
        mv -T /app/current.new /app/current
        echo "INFO release_switched from=$(basename "${old:-none}") to={{ aio_release }}" | aio-log deploy >/dev/null
        echo switched
      register: aio_switch
      changed_when: "'switched' in aio_switch.stdout"
      notify: [Restart pwc, Restart alloy, Restart relay, Restart xtc-forward]
      when: not ansible_check_mode

    # The current release and the one before stay, for a rollback; tools no
    # release links to go.
    - name: Remove old releases
      ansible.builtin.shell: |
        set -eu
        cd /app/releases
        current=$(basename "$(readlink /app/current)")
        ls -1t | grep -vxF "$current" | tail -n +{{ aio_keep_releases }} | while read -r old; do
          rm -rf "$old"
          echo "INFO release_removed release=$old" | aio-log deploy >/dev/null
          echo "removed $old"
        done
        used=$(for r in /app/releases/*/bin; do readlink "$r/alloy" "$r/caddy" || true; done | xargs -rn1 dirname | sort -u)
        for tool in /app/opt/alloy-* /app/opt/caddy-*; do
          [ -d "$tool" ] || continue
          grep -qxF "$tool" <<<"$used" || { rm -rf "$tool"; echo "removed $tool"; }
        done
      args:
        executable: /bin/bash
      register: aio_prune
      changed_when: aio_prune.stdout | length > 0
      when: not ansible_check_mode
