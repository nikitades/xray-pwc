---
# Takes a probe's container away on its host, with its state, log, volume and
# image, and the folder of compose.yml. Nothing else on the host was touched by
# this project. Needs SSH to the host, like probes-host.yml. Then forget the
# member: ansible-playbook vpnc-net-remove.yml -e name=<probe>
#   ansible-playbook probes-clean.yml --limit <probe>
- name: Clean the probe hosts
  hosts: probes
  gather_facts: false
  vars:
    ansible_host: "{{ probe_host }}"
    ansible_user: "{{ probe_host_user | default(omit) }}"
    ansible_port: "{{ probe_host_port | default(22) }}"
    ansible_ssh_common_args: ""
    ansible_python_interpreter: auto_silent

  pre_tasks:
    - name: Check the host is known
      ansible.builtin.assert:
        that: probe_host is defined
        fail_msg: >-
          no probe_host for {{ inventory_hostname }} in the inventory. On the host, in the
          folder of compose.yml: docker compose down -v --rmi all, then delete the folder.
        quiet: true

  tasks:
    # become changes the home, so the folder gets an absolute path first.
    - name: Find the folder
      ansible.builtin.command: printenv HOME
      register: probe_home
      changed_when: false
      check_mode: false

    - name: Pick the folder
      ansible.builtin.set_fact:
        probe_folder: "{{ probe_host_dir if probe_host_dir is abs else probe_home.stdout ~ '/' ~ probe_host_dir }}"

    - name: Find the compose file
      ansible.builtin.stat:
        path: "{{ probe_folder }}/compose.yml"
      register: probe_compose

    - name: Take the container down
      ansible.builtin.command: docker compose down -v --rmi all --remove-orphans
      args:
        chdir: "{{ probe_folder }}"
      become: true
      changed_when: true
      when: probe_compose.stat.exists and not ansible_check_mode

    # state/ and logs/ belong to root: the container wrote them.
    - name: Remove the folder
      ansible.builtin.file:
        path: "{{ probe_folder }}"
        state: absent
      become: true
