---
# Takes a probe's container away on its host, with its state, log, volume and
# image, and the folder of compose.yml: where the container runs, else
# ~/xray-pwc-aio (probe_host_dir). Nothing else on the host was touched by
# this project. Needs SSH to the host, like probes-host.yml. Then forget the
# member: ansible-playbook vpnc-net-remove.yml -e name=<probe>
#   ansible-playbook probes-clean.yml --limit <probe>
- name: Clean the probe hosts
  hosts: probes
  gather_facts: false
  vars:
    ansible_host: "{{ probe_host }}"
    ansible_user: "{{ probe_host_user | default(omit) }}"
    ansible_port: "{{ probe_host_port | default(22) }}"
    ansible_ssh_common_args: ""
    ansible_python_interpreter: auto_silent

  pre_tasks:
    - name: Check the host is known
      ansible.builtin.assert:
        that: probe_host is defined
        fail_msg: >-
          no probe_host for {{ inventory_hostname }} in the inventory. On the host, in the
          folder of compose.yml: docker compose down -v --rmi all, then delete the folder.
        quiet: true

  tasks:
    - name: Container folder
      ansible.builtin.import_tasks: tasks/probe-host-folder.yml

    - name: Find the compose file
      ansible.builtin.stat:
        path: "{{ probe_folder }}/compose.yml"
      register: probe_compose

    - name: Take the container down
      ansible.builtin.command: docker compose down -v --rmi all --remove-orphans
      args:
        chdir: "{{ probe_folder }}"
      become: true
      changed_when: true
      when: probe_compose.stat.exists and not ansible_check_mode

    # A container whose folder lost its compose.yml would stay running.
    - name: Check the container is gone
      ansible.builtin.command: docker inspect xray-pwc-aio
      become: true
      register: probe_left
      changed_when: false
      failed_when: false
      check_mode: false
      when: not ansible_check_mode

    - name: Report a container left running
      ansible.builtin.assert:
        that: probe_left.rc != 0
        fail_msg: >-
          xray-pwc-aio still exists on the host, and {{ probe_folder }} has no compose.yml
          for it. Take it down by hand: docker rm -f xray-pwc-aio, then docker volume rm
          xray-pwc-aio_app and its folder.
        quiet: true
      when: not ansible_check_mode

    # state/ and logs/ belong to root: the container wrote them.
    - name: Remove the folder
      ansible.builtin.file:
        path: "{{ probe_folder }}"
        state: absent
      become: true
