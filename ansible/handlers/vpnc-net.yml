---
# Handlers for tasks/vpnc-net.yml.
- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true

# wg syncconf: new and removed peers, the interface stays up. A new address or
# port needs: systemctl restart wg-quick@vpnc-net, then the monitoring stack.
- name: Reload vpnc-net
  ansible.builtin.systemd_service:
    name: wg-quick@{{ vpnc_net_interface }}
    state: reloaded
  when: not ansible_check_mode
