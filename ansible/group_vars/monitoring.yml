---
monitoring_dir: /opt/vpn-monitoring

prom_image: prom/prometheus:v3.15.0
grafana_image: grafana/grafana:13.2.2

# Loopback only; Caddy faces the internet.
prom_port: 9090
grafana_port: 3000

prom_retention_time: 180d
prom_retention_size: "40GB"

# caddy_grafana_domain, caddy_prometheus_domain and caddy_https_port are set in inventory.yml.
grafana_root_url: "https://{{ caddy_grafana_domain }}:{{ caddy_https_port }}/"
