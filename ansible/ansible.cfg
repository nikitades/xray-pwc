[defaults]
# inventory.d/: machines added by xray-pwc-net-join.yml.
inventory              = inventory.yml,inventory.d
collections_path       = ./collections
# The community.general.yaml callback was removed in community.general 12.0.0.
# Its standard replacement is the default callback with YAML result format.
stdout_callback        = ansible.builtin.default
callback_result_format = yaml
display_skipped_hosts  = False
interpreter_python     = auto_silent
forks                  = 10

[ssh_connection]
pipelining = True
ssh_args   = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
