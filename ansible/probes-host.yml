---
# The probe's host, not its container: puts compose.yml into the container's
# folder (where it runs now, else ~/xray-pwc-aio, probe_host_dir) and brings the
# container up with the image of this repository. Then writes the tunnel's part
# of the state into it (aio.env, the WireGuard config, the service links), so a
# probe whose tunnel is down gets a new outbound_access_policy or new service
# links without vpnc-net. For a new probe, instead of copying compose.yml by
# hand, and to move a probe to a new image (xray-pwc-aio/VERSION). Needs SSH to
# the host: probe_host, probe_host_user and probe_host_port in the inventory.
# Docker with the compose plugin must be there.
#   ansible-playbook probes-host.yml --limit <probe>
- name: Probe hosts (xray-pwc-aio container)
  hosts: probes
  gather_facts: false
  vars:
    ansible_host: "{{ probe_host }}"
    ansible_user: "{{ probe_host_user | default(omit) }}"
    ansible_port: "{{ probe_host_port | default(22) }}"
    ansible_ssh_common_args: ""
    ansible_python_interpreter: auto_silent
    # Writes stdin to the file $1 with mode $2 if it differs, and says so.
    probe_put_file: |
      set -eu
      mkdir -p "$(dirname "$1")"
      tmp=$(mktemp "$1.XXXXXX")
      cat >"$tmp"
      if cmp -s "$tmp" "$1"; then rm -f "$tmp"; exit 0; fi
      chmod "$2" "$tmp"
      mv "$tmp" "$1"
      echo changed

  pre_tasks:
    - name: Check the host is known
      ansible.builtin.assert:
        that: probe_host is defined
        fail_msg: >-
          no probe_host for {{ inventory_hostname }} in the inventory. Without SSH to the
          host, copy files/vpnc-net/join/{{ inventory_hostname }}/compose.yml there by hand
          and run docker compose up -d in its folder.
        quiet: true

    - name: Outbound access policy
      ansible.builtin.import_tasks: tasks/outbound-policy.yml

  tasks:
    - name: Container folder
      ansible.builtin.import_tasks: tasks/probe-host-folder.yml

    - name: Create the folder
      ansible.builtin.file:
        path: "{{ probe_folder }}"
        state: directory
        mode: "0700"

    # With the join token: ignored by a container that already has its state.
    - name: Template compose file
      ansible.builtin.template:
        src: templates/probe/compose.yml.j2
        dest: "{{ probe_folder }}/compose.yml"
        mode: "0600"
      no_log: true
      register: probe_compose

    - name: Bring up the container
      ansible.builtin.command: docker compose up -d --pull missing --remove-orphans
      args:
        chdir: "{{ probe_folder }}"
      become: true
      register: probe_up
      changed_when: probe_up.stderr is search('Started|Recreated|Created|Pulled')
      when: not ansible_check_mode

    # The host key is the last thing the first start writes: the state is
    # complete, and what follows does not race the token.
    - name: Wait for the state
      ansible.builtin.command: docker exec xray-pwc-aio test -f /app/state/ssh/ssh_host_ed25519_key
      become: true
      register: probe_state
      until: probe_state.rc == 0
      retries: 30
      delay: 2
      changed_when: false
      when: not ansible_check_mode

    # The same files as probes.yml writes, from the same templates.
    - name: Write tunnel settings
      ansible.builtin.command:
        argv: [docker, exec, -i, xray-pwc-aio, sh, -c, "{{ probe_put_file }}", put, "{{ item.dest }}", "{{ item.mode }}"]
        stdin: "{{ item.content }}"
        stdin_add_newline: false
      loop:
        - { dest: /app/state/aio.env, mode: "644", content: "{{ lookup('template', 'templates/probe/aio.env.j2') }}" }
        - { dest: /app/state/wg/vpnc-net.conf, mode: "600", content: "{{ lookup('template', 'templates/probe/wg.conf.j2') }}" }
        - { dest: /app/state/service_links.txt, mode: "600", content: "{{ vpnc_net_via_links }}" }
      loop_control:
        label: "{{ item.dest }}"
      become: true
      no_log: true
      register: probe_tunnel
      changed_when: "'changed' in probe_tunnel.stdout"
      when: not ansible_check_mode

    - name: Restart the tunnel
      ansible.builtin.command: >-
        docker exec xray-pwc-aio sh -c
        'for s in wg xtc-forward relay sshd; do s6-svc -r /run/service/svc-$s; done'
      become: true
      changed_when: true
      when: not ansible_check_mode and probe_tunnel is changed

    - name: Remove old images
      ansible.builtin.shell: >-
        docker image ls '{{ aio_image | regex_replace(':[^:/]*$', '') }}'
        --format '{% raw %}{{.Repository}}:{{.Tag}}{% endraw %}'
        | grep -vxF '{{ aio_image }}'
        | xargs -r docker image rm
      become: true
      register: probe_old_images
      changed_when: probe_old_images.stdout | length > 0
      when: not ansible_check_mode
