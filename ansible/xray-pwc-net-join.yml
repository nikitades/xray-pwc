---
# Adds a machine to xray-pwc-net.
#   a probe:      ansible-playbook xray-pwc-net-join.yml -e name=<name> -e policy=<plain|relay|vpn>
#                 with policy=vpn also -e service_links=<base64 of the links, one per line>
#                 [-e target=<us|ru>]: the registry its image comes from (default us)
#                 [-e check=<heavy|light>]: how its checker loads pages (default heavy)
#   the server:   ansible-playbook xray-pwc-net-join.yml -e name=<the monitoring host>
# policy is the probe's outbound_access_policy, target its aio_target, check its
# check_policy (group_vars/probes.yml).
# Writes host_vars/<name>/xray-pwc-net.yml (address and keys). For a probe it also writes
# inventory.d/<name>.yml with the policy, the target and the check, files/probes/<name>/service_links.txt from
# service_links, and empty links.txt and service_links.txt, unless they are there,
# tells the server, and makes
# files/xray-pwc-net/join/<name>/compose.yml: the probe's container with its join token,
# to start on the machine with `docker compose up -d`, and next-steps.txt.
# With outbound_access_policy: vpn, the token has the links of service_links.txt.
# For the xray-pwc-net server (the monitoring host) it only writes the keys:
# monitoring.yml sets the server up.
# Running it again for the same name keeps the address and the keys.

- name: Register the xray-pwc-net member
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    join_dir: "{{ playbook_dir }}/host_vars/{{ name }}"
    # Every address in host_vars counts, also of a member that is out of the
    # inventory for now (commented out): it keeps its address for later.
    join_used_ips: "{{ join_known_ips.stdout_lines | map('split') | map('last') | list }}"
    join_prefix: "{{ pwc_net_subnet.split('/')[0].rsplit('.', 1)[0] }}"
    # The server is .1; the rest get the first free address from .10.
    join_ip: "{{ join_prefix ~ '.1' if name == pwc_net_server else range(10, 255) | map('string') | map('regex_replace', '^', join_prefix ~ '.') | reject('in', join_used_ips) | first }}"
    join_probe: "{{ name != pwc_net_server }}"
    join_inventory: "{{ playbook_dir }}/inventory.d/{{ name }}.yml"
    # -e service_links: the links, one per line, in base64 (base64 < service_links.txt).
    join_service_links: "{{ (service_links | default('') | b64decode).splitlines() | map('trim') | reject('match', '^(#|$)') | list }}"
    # -e target, else what the inventory has for the probe (a rerun keeps it), else us.
    join_target: "{{ target | default((hostvars[name] | default({})).aio_target | default('us')) }}"
    # -e check, else what the inventory has for the probe, else heavy.
    join_check: "{{ check | default((hostvars[name] | default({})).check_policy | default('heavy')) }}"

  tasks:
    - name: Check parameters
      ansible.builtin.assert:
        that:
          - name | default('') is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
        fail_msg: >-
          -e name=<name>. A name is a DNS label: lowercase letters, digits and dashes.
          It becomes the probe's hostname and <name>.{{ pwc_net_domain }}.
        quiet: true

    - name: Check policy
      ansible.builtin.assert:
        that:
          - policy | default('') in outbound_access_policies
        fail_msg: >-
          -e policy=<{{ outbound_access_policies | join('|') }}>: how the probe reaches the
          server, its outbound_access_policy (group_vars/probes.yml)
        quiet: true
      when: join_probe

    - name: Check target
      ansible.builtin.assert:
        that:
          - join_target in aio_registries
        fail_msg: >-
          -e target=<{{ aio_registries | join('|') }}>: the registry the probe pulls its image
          from (aio_registries, group_vars/all.yml); us when not given
        quiet: true
      when: join_probe

    - name: Check check policy
      ansible.builtin.assert:
        that:
          - join_check in check_policies
        fail_msg: >-
          -e check=<{{ check_policies | join('|') }}>: how the probe's checker loads pages,
          its check_policy (group_vars/probes.yml); heavy when not given
        quiet: true
      when: join_probe

    - name: Check service links
      ansible.builtin.assert:
        that:
          - policy != 'vpn' or join_service_links | length > 0
          - join_service_links | reject('match', '^[a-z][a-z0-9+.-]*://') | list | length == 0
        fail_msg: >-
          policy=vpn needs -e service_links=<base64 of the links, one per line>, for example
          -e service_links="$(base64 < service_links.txt)": the tunnel to the server goes through them.
          Every line must be a share link.
        quiet: true
      when: join_probe

    - name: Find inventory entry
      ansible.builtin.stat:
        path: "{{ join_inventory }}"
      register: join_inventory_file
      when: join_probe

    # A probe set in inventory.yml keeps its settings there.
    - name: Check inventory settings
      ansible.builtin.assert:
        that:
          - hostvars[name].outbound_access_policy == policy
          - hostvars[name].aio_target == join_target
          - hostvars[name].check_policy == join_check
        fail_msg: >-
          {{ name }} is in inventory.yml with outbound_access_policy:
          {{ hostvars[name].outbound_access_policy }}, aio_target: {{ hostvars[name].aio_target }}
          and check_policy: {{ hostvars[name].check_policy }}: change them there, or pass
          -e policy=, -e target= and -e check= to match
        quiet: true
      when: join_probe and name in groups['all'] and not join_inventory_file.stat.exists

    - name: Find used addresses
      ansible.builtin.shell: grep -h '^pwc_net_ip:' {{ playbook_dir }}/host_vars/*/xray-pwc-net.yml || true
      register: join_known_ips
      changed_when: false
      check_mode: false

    - name: Find member settings
      ansible.builtin.stat:
        path: "{{ join_dir }}/xray-pwc-net.yml"
      register: join_member

    - name: Pick address and keys
      when: not join_member.stat.exists
      block:
        # Raw X25519 keys in base64, the WireGuard format: the last 32 bytes of the DER.
        - name: Generate key pair
          ansible.builtin.shell: |
            set -euo pipefail
            der=$(openssl genpkey -algorithm X25519 -outform DER | base64)
            echo "$der" | base64 -d | tail -c 32 | base64
            echo "$der" | base64 -d | openssl pkey -inform DER -pubout -outform DER | tail -c 32 | base64
          args:
            executable: /bin/bash
          register: join_keys
          changed_when: true
          # Only prints them: with --check the settings are shown, not written.
          check_mode: false
          no_log: true

        - name: Create host_vars directory
          ansible.builtin.file:
            path: "{{ join_dir }}"
            state: directory
            mode: "0700"

        - name: Write member settings
          ansible.builtin.template:
            src: templates/xray-pwc-net/member.yml.j2
            dest: "{{ join_dir }}/xray-pwc-net.yml"
            mode: "0600"
          no_log: true

    - name: Add to inventory
      ansible.builtin.template:
        src: templates/xray-pwc-net/inventory.yml.j2
        dest: "{{ join_inventory }}"
        mode: "0644"
      when: join_probe and (name not in groups['all'] or join_inventory_file.stat.exists)

    - name: Reload inventory
      ansible.builtin.meta: refresh_inventory

    # Empty files, to be filled in; existing ones are kept.
    - name: Create link files
      when: join_probe
      block:
        - name: Create links directory
          ansible.builtin.file:
            path: "{{ playbook_dir }}/files/probes/{{ name }}"
            state: directory
            mode: "0700"

        - name: Write service links
          ansible.builtin.copy:
            content: "{{ join_service_links | join('\n') ~ '\n' }}"
            dest: "{{ playbook_dir }}/files/probes/{{ name }}/service_links.txt"
            mode: "0600"
          no_log: true
          when: join_service_links | length > 0

        - name: Create empty link files
          ansible.builtin.copy:
            content: ""
            dest: "{{ playbook_dir }}/files/probes/{{ name }}/{{ item }}"
            mode: "0600"
            force: false
          loop: [links.txt, service_links.txt]

# Not for the server itself: monitoring.yml does that.
- name: Tell the xray-pwc-net server
  hosts: "{{ 'monitoring' if name != groups.monitoring[0] else 'none' }}"
  become: true

  handlers:
    - name: Xray-pwc-net handlers
      ansible.builtin.import_tasks: handlers/xray-pwc-net.yml

  tasks:
    - name: Xray-pwc-net tunnel
      ansible.builtin.import_tasks: tasks/xray-pwc-net.yml

- name: Make the compose file
  hosts: "{{ name }}"
  gather_facts: false
  vars:
    pwc_net_join_server: "{{ inventory_hostname == pwc_net_server }}"
    pwc_net_join_compose: "{{ pwc_net_join_dir }}/{{ inventory_hostname }}/compose.yml"
  tasks:
    - name: Outbound access policy
      ansible.builtin.include_tasks: tasks/outbound-policy.yml
      when: not pwc_net_join_server

    - name: Create join directory
      ansible.builtin.file:
        path: "{{ pwc_net_join_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      when: not pwc_net_join_server

    - name: Write compose file
      ansible.builtin.template:
        src: templates/probe/compose.yml.j2
        dest: "{{ pwc_net_join_compose }}"
        mode: "0600"
      no_log: true
      delegate_to: localhost
      when: not pwc_net_join_server

    - name: Write next steps
      ansible.builtin.template:
        src: templates/xray-pwc-net/join-note.txt.j2
        dest: "{{ pwc_net_join_dir }}/{{ inventory_hostname ~ ('.txt' if pwc_net_join_server else '/next-steps.txt') }}"
        mode: "0600"
      delegate_to: localhost

    - name: Show next steps
      ansible.builtin.debug:
        msg: "{{ lookup('template', 'templates/xray-pwc-net/join-note.txt.j2').splitlines() }}"
