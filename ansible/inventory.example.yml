---
# Copy to inventory.yml (git-ignored) and fill in your hosts and domains.
# Probes added with xray-pwc-net-join.yml go to inventory.d/; every xray-pwc-net member gets
# host_vars/<name>/xray-pwc-net.yml with its address and keys. Ansible reaches a probe's
# container through xray-pwc-net and the monitoring host (group_vars/probes.yml).
all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    caddy_grafana_domain: grafana.example.com
    caddy_https_port: 443
    # The SSH key that goes into the probes; Ansible logs in with its private half.
    pwc_net_ssh_key: ~/.ssh/id_ed25519.pub
  children:
    monitoring:
      hosts:
        mon-1:
          ansible_host: monitor.example.com
          ansible_user: root

    # Per-probe settings. A probe that xray-pwc-net-join.yml added can be listed here
    # too, for them.
    probes:
      hosts:
        probe-1:
          # Optional: DNS servers for the container, when the host resolver gives
          # answers Go programs cannot read (some home routers do).
          # probe_dns: [1.1.1.1, 8.8.8.8]
          # Optional: how the probe's own traffic leaves its network, plain (the
          # default), relay or vpn; see group_vars/probes.yml. vpn takes the links in
          # files/probes/probe-1/service_links.txt, for networks that block UDP.
          # outbound_access_policy: vpn
