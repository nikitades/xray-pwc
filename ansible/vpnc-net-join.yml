---
# Adds a machine to vpnc-net.
#   a probe:      ansible-playbook vpnc-net-join.yml -e name=<name>
#   the server:   ansible-playbook vpnc-net-join.yml -e name=<the monitoring host>
# Writes host_vars/<name>/vpnc-net.yml (address and keys) and tells the server. For a
# new probe it also writes inventory.d/<name>.yml and files/probes/<name>/ with empty
# links.txt and service_links.txt, unless they are there. Then makes
# files/vpnc-net/join/<name>/compose.yml: the probe's container with its join token,
# to start on the machine with `docker compose up -d`, and next-steps.txt.
# With links in files/probes/<name>/service_links.txt, the tunnel goes through them.
# For the vpnc-net server (the monitoring host) it only writes the keys.
# Running it again for the same name keeps the address and the keys.

- name: Register the vpnc-net member
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    join_dir: "{{ playbook_dir }}/host_vars/{{ name }}"
    join_used_ips: "{{ groups['all'] | map('extract', hostvars) | selectattr('vpnc_net_ip', 'defined') | map(attribute='vpnc_net_ip') | list }}"
    join_prefix: "{{ vpnc_net_subnet.split('/')[0].rsplit('.', 1)[0] }}"
    # The server is .1; the rest get the first free address from .10.
    join_ip: "{{ join_prefix ~ '.1' if name == vpnc_net_server else range(10, 255) | map('string') | map('regex_replace', '^', join_prefix ~ '.') | reject('in', join_used_ips) | first }}"

  tasks:
    - name: Check parameters
      ansible.builtin.assert:
        that:
          - name | default('') is match('^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$')
        fail_msg: >-
          -e name=<name>. A name is a DNS label: lowercase letters, digits and dashes.
          It becomes the probe's hostname and <name>.{{ vpnc_net_domain }}.
        quiet: true

    - name: Find member settings
      ansible.builtin.stat:
        path: "{{ join_dir }}/vpnc-net.yml"
      register: join_member

    - name: Pick address and keys
      when: not join_member.stat.exists
      block:
        # Raw X25519 keys in base64, the WireGuard format: the last 32 bytes of the DER.
        - name: Generate key pair
          ansible.builtin.shell: |
            set -euo pipefail
            der=$(openssl genpkey -algorithm X25519 -outform DER | base64)
            echo "$der" | base64 -d | tail -c 32 | base64
            echo "$der" | base64 -d | openssl pkey -inform DER -pubout -outform DER | tail -c 32 | base64
          args:
            executable: /bin/bash
          register: join_keys
          changed_when: true
          no_log: true

        - name: Create host_vars directory
          ansible.builtin.file:
            path: "{{ join_dir }}"
            state: directory
            mode: "0700"

        - name: Write member settings
          ansible.builtin.template:
            src: templates/vpnc-net/member.yml.j2
            dest: "{{ join_dir }}/vpnc-net.yml"
            mode: "0600"
          no_log: true

    - name: Add to inventory
      ansible.builtin.template:
        src: templates/vpnc-net/inventory.yml.j2
        dest: "{{ playbook_dir }}/inventory.d/{{ name }}.yml"
        mode: "0644"
      when: name not in groups['all']

    - name: Reload inventory
      ansible.builtin.meta: refresh_inventory

    # Empty files, to be filled in; existing ones are kept.
    - name: Create link files
      when: name != vpnc_net_server
      block:
        - name: Create links directory
          ansible.builtin.file:
            path: "{{ playbook_dir }}/files/probes/{{ name }}"
            state: directory
            mode: "0700"

        - name: Create empty link files
          ansible.builtin.copy:
            content: ""
            dest: "{{ playbook_dir }}/files/probes/{{ name }}/{{ item }}"
            mode: "0600"
            force: false
          loop: [links.txt, service_links.txt]

- name: Tell the vpnc-net server
  hosts: monitoring
  become: true

  handlers:
    - name: Vpnc-net handlers
      ansible.builtin.import_tasks: handlers/vpnc-net.yml

  tasks:
    - name: Vpnc-net tunnel
      ansible.builtin.import_tasks: tasks/vpnc-net.yml

- name: Make the compose file
  hosts: "{{ name }}"
  gather_facts: false
  vars:
    vpnc_net_join_server: "{{ inventory_hostname == vpnc_net_server }}"
    vpnc_net_join_compose: "{{ vpnc_net_join_dir }}/{{ inventory_hostname }}/compose.yml"
  tasks:
    - name: Create join directory
      ansible.builtin.file:
        path: "{{ vpnc_net_join_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      when: not vpnc_net_join_server

    - name: Write compose file
      ansible.builtin.template:
        src: templates/probe/compose.yml.j2
        dest: "{{ vpnc_net_join_compose }}"
        mode: "0600"
      no_log: true
      delegate_to: localhost
      when: not vpnc_net_join_server

    - name: Write next steps
      ansible.builtin.template:
        src: templates/vpnc-net/join-note.txt.j2
        dest: "{{ vpnc_net_join_dir }}/{{ inventory_hostname ~ ('.txt' if vpnc_net_join_server else '/next-steps.txt') }}"
        mode: "0600"
      delegate_to: localhost

    - name: Show next steps
      ansible.builtin.debug:
        msg: "{{ lookup('file', vpnc_net_join_dir ~ '/' ~ inventory_hostname ~ ('.txt' if vpnc_net_join_server else '/next-steps.txt')).splitlines() }}"
