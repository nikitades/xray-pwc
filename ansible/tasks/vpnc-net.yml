---
# The vpnc-net server on the monitoring host: wg-quick@vpnc-net with the kernel's
# WireGuard, a peer for every member, and the CoreDNS names. The playbook imports
# handlers/vpnc-net.yml. A reload applies new peers without taking the interface down.

- name: Check vpnc-net settings
  ansible.builtin.assert:
    that:
      - vpnc_net_ip is defined
      - vpnc_net_private_key | default('') | length > 0
    fail_msg: "{{ inventory_hostname }} has no host_vars/{{ inventory_hostname }}/vpnc-net.yml (vpnc-net-join.yml -e name={{ inventory_hostname }})"
    quiet: true

- name: Install WireGuard tools
  ansible.builtin.apt:
    name: wireguard-tools
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Template vpnc-net config
  ansible.builtin.template:
    src: templates/vpnc-net/server.conf.j2
    dest: /etc/wireguard/{{ vpnc_net_interface }}.conf
    mode: "0600"
  no_log: true
  notify: Reload vpnc-net

- name: Ensure vpnc-net is running
  ansible.builtin.systemd_service:
    name: wg-quick@{{ vpnc_net_interface }}
    state: started
    enabled: true
  when: not ansible_check_mode

- name: Create docker drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    mode: "0755"

# Containers publish ports on the vpnc-net address, so it must exist before they start.
- name: Start docker after vpnc-net
  ansible.builtin.copy:
    content: |
      [Unit]
      Wants=wg-quick@{{ vpnc_net_interface }}.service
      After=wg-quick@{{ vpnc_net_interface }}.service
    dest: /etc/systemd/system/docker.service.d/vpnc-net.conf
    mode: "0644"
  notify: Reload systemd

- name: Create coredns directory
  ansible.builtin.file:
    path: "{{ monitoring_dir }}/coredns"
    state: directory
    mode: "0755"

# CoreDNS rereads both files itself, no restart needed.
- name: Template coredns config
  ansible.builtin.template:
    src: templates/monitoring/{{ item.src }}
    dest: "{{ monitoring_dir }}/coredns/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: Corefile.j2, dest: Corefile }
    - { src: vpnc-net.hosts.j2, dest: vpnc-net.hosts }

# The monitoring stack binds to the vpnc-net address.
- name: Flush handlers
  ansible.builtin.meta: flush_handlers
