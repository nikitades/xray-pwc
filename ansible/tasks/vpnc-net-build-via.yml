---
# Builds xray-tun-connect for vpnc_net_arch on this machine, once per version and CPU type.
- name: Build xray-tun-connect locally
  ansible.builtin.command:
    cmd: >-
      docker run --rm -v {{ vpnc_net_via_source }}:/src:ro -v {{ vpnc_net_via_bin | dirname }}:/out -w /src
      -e CGO_ENABLED=0 -e GOOS=linux -e GOARCH={{ vpnc_net_arch }} -e GOFLAGS=-buildvcs=false
      {{ vpnc_net_via_build_image }}
      go build -trimpath -ldflags "-s -w" -o /out/{{ vpnc_net_via_bin | basename }} ./cmd/xray-tun-connect
    creates: "{{ vpnc_net_via_bin }}"
  delegate_to: localhost
  become: false
  throttle: 1
