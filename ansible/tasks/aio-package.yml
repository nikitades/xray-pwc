---
# One package, a zstd tar file here (package.src), unpacked into package.dest in
# the container unless it is there already. Unpacked next to the target and
# moved in place, so a broken copy never looks like a package.
- name: Find {{ package.dest }}
  ansible.builtin.stat:
    path: "{{ package.dest }}"
  register: aio_package

- name: Unpack {{ package.dest }}
  when: not aio_package.stat.exists
  vars:
    aio_package_tmp: /app/{{ package.src | basename }}
  block:
    - name: Create {{ package.dest | dirname }}
      ansible.builtin.file:
        path: "{{ package.dest | dirname }}"
        state: directory
        mode: "0755"

    - name: Copy {{ package.src | basename }}
      ansible.builtin.copy:
        src: "{{ package.src }}"
        dest: "{{ aio_package_tmp }}"
        mode: "0600"

    - name: Unpack {{ package.src | basename }}
      ansible.builtin.shell: |
        set -eu
        rm -rf "{{ package.dest }}.new"
        mkdir -p "{{ package.dest }}.new"
        tar --zstd -xf "{{ aio_package_tmp }}" -C "{{ package.dest }}.new"
        mv -T "{{ package.dest }}.new" "{{ package.dest }}"
      changed_when: true

  always:
    - name: Remove {{ package.src | basename }}
      ansible.builtin.file:
        path: "{{ aio_package_tmp }}"
        state: absent
