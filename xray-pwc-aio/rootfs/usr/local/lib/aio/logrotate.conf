# A week per file, four weeks back: a month of history. The last week stays
# uncompressed until the next rotation.
/app/logs/aio.log {
    weekly
    rotate 4
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
    postrotate
        echo "INFO rotated file=/app/logs/aio.log"
    endscript
}
