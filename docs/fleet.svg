<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 660" width="1280" height="660" role="img" aria-labelledby="t d">
  <title id="t">xray-pwc: a fleet of cheap probes and one monitoring server</title>
  <desc id="d">Each probe is one Docker container on any computer behind NAT: no public IP, no port forwarding, no root. It reaches the monitoring server through WireGuard inside xray, sends metrics there and receives releases from Ansible the same way. The server shows every tunnel on a dashboard.</desc>
  <style>
    :root {
      --bg: #f7f8fa; --card: #ffffff; --line: #d0d5dd; --text: #1d2433; --muted: #667085;
      --zone: #eef1f5; --box: #e8f1ff; --boxline: #3b82f6; --chip: #f2f4f7;
      --pipe: #dbe6fb; --flow: #3b82f6; --ok: #16a34a; --pi: #15803d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1218; --card: #181c24; --line: #2c3240; --text: #e6e9ef; --muted: #8b93a7;
        --zone: #141821; --box: #132036; --boxline: #4f8cf7; --chip: #212734;
        --pipe: #1c2a44; --flow: #6aa1ff; --ok: #4ade80; --pi: #22c55e;
      }
    }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
    .mono, .mono text { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
    .muted { fill: var(--muted); }
    .flavor { font-style: italic; }
    .h { font-weight: 600; }
    .card { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
    .zone { fill: var(--zone); stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 6 6; }
    .box { fill: var(--box); stroke: var(--boxline); stroke-width: 2; }
    .chip { fill: var(--chip); stroke: var(--line); }
    .ico { fill: none; stroke: var(--muted); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
    .pill { fill: none; stroke: var(--ok); stroke-width: 1.5; }
    .ok { fill: var(--ok); }
    .pipe { fill: none; stroke: var(--pipe); stroke-linecap: round; }
    .flow { fill: none; stroke: var(--flow); stroke-width: 2; stroke-dasharray: 6 10; stroke-linecap: round; animation: flow 1.6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -32; } }
    @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
    /* The dashboard is a screen: dark in both themes, like Grafana's. */
    .g-bg { fill: #111217; stroke: #2a2d33; stroke-width: 1.5; }
    .g-panel { fill: #181b1f; stroke: #24272e; }
    .g-t, .g-t text { fill: #ccccdc; }
    .g-m, .g-m text { fill: #8e8e9e; }
    .g-grid { stroke: #24272e; }
    .g-ok { fill: #73bf69; } .g-bad { fill: #f2495c; } .g-warn { fill: #fade2a; }
    .g-arc { fill: none; stroke-width: 7; stroke-linecap: round; }
  </style>

  <rect width="1280" height="660" rx="16" style="fill: var(--bg)"/>

  <!-- Title -->
  <text x="32" y="62" font-size="28" class="h mono">xray-pwc</text>
  <text x="32" y="90" font-size="15" class="muted">a fleet of cheap probes, one monitoring server</text>
  <text x="32" y="112" font-size="15" class="muted">every probe is one container, and it only dials out</text>

  <!-- Pipes: every probe dials out to the server -->
  <g>
    <path class="pipe" stroke-width="12" d="M438 320 C640 320 700 520 880 520"/>
    <path class="flow" d="M438 320 C640 320 700 520 880 520"/>
    <path class="pipe" stroke-width="7" d="M770 84 C830 84 830 470 880 470"/>
    <path class="flow" d="M770 84 C830 84 830 470 880 470"/>
    <path class="pipe" stroke-width="7" d="M770 216 C830 216 830 495 880 495"/>
    <path class="flow" d="M770 216 C830 216 830 495 880 495"/>
    <path class="pipe" stroke-width="7" d="M770 588 C830 588 820 580 880 580"/>
    <path class="flow" d="M770 588 C830 588 820 580 880 580"/>
  </g>
  <text x="466" y="432" font-size="14" class="h" style="fill: var(--flow)">WireGuard inside xray</text>
  <text x="466" y="450" font-size="12.5" class="muted">looks like HTTPS · outbound only</text>
  <text x="466" y="478" font-size="12.5" class="muted">→ metrics to Prometheus</text>
  <text x="466" y="496" font-size="12.5" class="muted">← releases from Ansible</text>

  <!-- The probe in focus -->
  <rect class="zone" x="24" y="150" width="430" height="476" rx="16"/>
  <text x="44" y="176" font-size="13" class="muted">home network · behind NAT</text>

  <rect class="card" x="44" y="190" width="300" height="270" rx="12"/>
  <circle cx="324" cy="208" r="4" class="ok"/>
  <text x="62" y="216" font-size="15" class="h">your host</text>
  <text x="62" y="234" font-size="12.5" class="muted">any computer with Docker</text>

  <rect class="box" x="62" y="246" width="264" height="196" rx="10"/>
  <g class="ico" style="stroke: var(--boxline)">
    <path d="M80 262 l9 -5 l9 5 v10 l-9 5 l-9 -5 z M80 262 l9 5 l9 -5 M89 267 v10"/>
  </g>
  <text x="106" y="272" font-size="14" class="h mono">xray-pwc-aio</text>
  <text x="80" y="292" font-size="12" class="muted">one container · services run as abc</text>
  <g font-size="12.5" class="mono">
    <rect class="chip" x="78" y="304" width="112" height="30" rx="6"/><circle cx="92" cy="319" r="4" class="ok"/><text x="102" y="323">probe</text>
    <rect class="chip" x="198" y="304" width="112" height="30" rx="6"/><circle cx="212" cy="319" r="4" class="ok"/><text x="222" y="323">connect</text>
    <rect class="chip" x="78" y="342" width="112" height="30" rx="6"/><circle cx="92" cy="357" r="4" class="ok"/><text x="102" y="361">wg</text>
    <rect class="chip" x="198" y="342" width="112" height="30" rx="6"/><circle cx="212" cy="357" r="4" class="ok"/><text x="222" y="361">alloy</text>
    <rect class="chip" x="78" y="380" width="112" height="30" rx="6"/><circle cx="92" cy="395" r="4" class="ok"/><text x="102" y="399">sshd</text>
    <rect class="chip" x="198" y="380" width="112" height="30" rx="6"/><circle cx="212" cy="395" r="4" class="ok"/><text x="222" y="399">logrotate</text>
  </g>
  <text x="80" y="430" font-size="11.5" class="muted mono">volume app → /app</text>

  <!-- Router -->
  <line x1="344" y1="320" x2="368" y2="320" style="stroke: var(--line)" stroke-width="3"/>
  <g class="ico">
    <rect x="368" y="304" width="70" height="34" rx="6" style="fill: var(--card)"/>
    <path d="M382 304 l-6 -18 M424 304 l6 -18"/>
  </g>
  <circle cx="382" cy="321" r="3" class="ok"/><circle cx="394" cy="321" r="3" class="ok"/>
  <text x="403" y="358" font-size="12" class="muted" text-anchor="middle">router</text>
  <g class="ico" style="stroke: #e5484d">
    <circle cx="378" cy="378" r="7"/><path d="M373 383 l10 -10"/>
  </g>
  <text x="390" y="382" font-size="11.5" class="muted">no port</text>
  <text x="390" y="396" font-size="11.5" class="muted">forwarding</text>

  <!-- What it does not need -->
  <g font-size="13">
    <rect class="pill" x="44" y="480" width="110" height="28" rx="14"/><text x="58" y="499"><tspan class="ok">✓</tspan> only Docker</text>
    <rect class="pill" x="162" y="480" width="84" height="28" rx="14"/><text x="176" y="499"><tspan class="ok">✓</tspan> no root</text>
    <rect class="pill" x="254" y="480" width="128" height="28" rx="14"/><text x="268" y="499"><tspan class="ok">✓</tspan> no open ports</text>
    <rect class="pill" x="44" y="516" width="120" height="28" rx="14"/><text x="58" y="535"><tspan class="ok">✓</tspan> no public IP</text>
    <rect class="pill" x="172" y="516" width="150" height="28" rx="14"/><text x="186" y="535"><tspan class="ok">✓</tspan> ~$30 of hardware</text>
  </g>
  <text x="44" y="580" font-size="12.5" class="muted">set up once, by the host's owner:</text>
  <text x="44" y="602" font-size="13" class="mono">docker compose up -d</text>

  <!-- More probes, the same -->
  <g>
    <rect class="card" x="500" y="24" width="270" height="120" rx="12"/>
    <g class="ico">
      <rect x="518" y="58" width="40" height="52" rx="5"/>
      <path d="M526 72 h24 M526 84 h24 M526 96 h24"/>
    </g>
    <text x="574" y="50" font-size="13" class="h mono">lisbon-nas</text>
    <text x="574" y="68" font-size="12" class="muted">Synology DS218+</text>
    <text x="574" y="84" font-size="12" class="muted">Lisbon</text>
    <text x="574" y="100" font-size="12" class="muted flavor">mostly family photos</text>
    <rect class="box" x="574" y="112" width="110" height="22" rx="5" stroke-width="1.5"/>
    <text x="629" y="127" font-size="11" class="mono" text-anchor="middle">xray-pwc-aio</text>
  </g>
  <g>
    <rect class="card" x="500" y="156" width="270" height="120" rx="12"/>
    <g class="ico">
      <rect x="516" y="194" width="46" height="32" rx="3"/>
      <path d="M508 230 h62 l-6 8 h-50 z"/>
    </g>
    <text x="574" y="182" font-size="13" class="h mono">elder-rylanor</text>
    <text x="574" y="200" font-size="12" class="muted">HP Pavilion dv7-6b01er laptop</text>
    <text x="574" y="216" font-size="12" class="muted">Saint-Petersburg</text>
    <text x="574" y="232" font-size="12" class="muted flavor">15 years of honorable service</text>
    <rect class="box" x="574" y="244" width="110" height="22" rx="5" stroke-width="1.5"/>
    <text x="629" y="259" font-size="11" class="mono" text-anchor="middle">xray-pwc-aio</text>
  </g>
  <g>
    <rect class="card" x="500" y="528" width="270" height="120" rx="12"/>
    <g class="ico">
      <rect x="514" y="564" width="50" height="34" rx="4"/>
      <path d="M539 598 v10 M528 612 h22"/>
    </g>
    <text x="574" y="554" font-size="13" class="h mono">almaty-pc</text>
    <text x="574" y="572" font-size="12" class="muted">Windows 11 gaming PC</text>
    <text x="574" y="588" font-size="12" class="muted">Almaty</text>
    <text x="574" y="604" font-size="12" class="muted flavor">probes while nobody plays</text>
    <rect class="box" x="574" y="616" width="110" height="22" rx="5" stroke-width="1.5"/>
    <text x="629" y="631" font-size="11" class="mono" text-anchor="middle">xray-pwc-aio</text>
  </g>

  <!-- Dashboard -->
  <rect class="g-bg" x="860" y="24" width="396" height="362" rx="10"/>
  <circle cx="878" cy="40" r="4" fill="#f2495c"/><circle cx="892" cy="40" r="4" fill="#fade2a"/><circle cx="906" cy="40" r="4" fill="#73bf69"/>
  <text x="922" y="44" font-size="11.5" class="g-t">Dashboards › Probes › Tunnels</text>
  <rect x="1168" y="31" width="76" height="20" rx="4" fill="#22252b"/>
  <text x="1206" y="45" font-size="10.5" class="g-t" text-anchor="middle">Last 1 hour</text>

  <rect class="g-panel" x="872" y="62" width="372" height="178" rx="4"/>
  <text x="882" y="80" font-size="11.5" class="g-t">Tunnels at probes</text>
  <g class="g-grid" stroke-width="1">
    <path d="M1041 90 v130 M1080 90 v130 M1119 90 v130 M1158 90 v130 M1197 90 v130"/>
  </g>
  <g font-size="9.5" class="mono g-m" text-anchor="end">
    <text x="996" y="107">link-a@home</text>
    <text x="996" y="139">vox-link@home</text>
    <text x="996" y="171">link-a@lisbon-nas</text>
    <text x="996" y="203">link-a@elder-rylanor</text>
  </g>
  <rect class="g-ok" x="1002" y="94" width="234" height="20" rx="2"/>
  <rect class="g-ok" x="1002" y="126" width="98" height="20" rx="2"/>
  <rect class="g-bad" x="1100" y="126" width="22" height="20"/>
  <rect class="g-ok" x="1122" y="126" width="114" height="20" rx="2"/>
  <rect class="g-ok" x="1002" y="158" width="234" height="20" rx="2"/>
  <rect class="g-ok" x="1002" y="190" width="178" height="20" rx="2"/>
  <rect class="g-warn" x="1180" y="190" width="56" height="20" rx="2"/>
  <g font-size="8.5" class="g-m" text-anchor="middle">
    <text x="1002" y="232">16:40</text><text x="1080" y="232">17:00</text><text x="1158" y="232">17:20</text><text x="1236" y="232">17:40</text>
  </g>

  <rect class="g-panel" x="872" y="248" width="372" height="92" rx="4"/>
  <text x="882" y="265" font-size="11.5" class="g-t">Online</text>
  <g>
    <path class="g-arc" stroke="#2a2d33" d="M892 320 a26 26 0 0 1 52 0 M985 320 a26 26 0 0 1 52 0 M1078 320 a26 26 0 0 1 52 0 M1171 320 a26 26 0 0 1 52 0"/>
    <path class="g-arc" stroke="#73bf69" d="M892 320 a26 26 0 0 1 52 0 M985 320 a26 26 0 0 1 52 0 M1078 320 a26 26 0 0 1 52 0"/>
    <path class="g-arc" stroke="#fade2a" d="M1171 320 a26 26 0 0 1 39 -22.5"/>
    <g font-size="17" class="g-t" text-anchor="middle">
      <text x="918" y="318">3</text><text x="1011" y="318">3</text><text x="1104" y="318">3</text><text x="1197" y="318">2</text>
    </g>
    <g font-size="7.5" class="mono g-m" text-anchor="middle">
      <text x="918" y="334">a@home</text><text x="1011" y="334">vox@home</text><text x="1104" y="334">a@lisbon</text><text x="1197" y="334">a@elder</text>
    </g>
  </g>

  <rect class="g-panel" x="872" y="348" width="372" height="28" rx="4"/>
  <text x="882" y="366" font-size="11.5" class="g-t">Errors</text>
  <text x="1058" y="366" font-size="11" class="g-m" text-anchor="middle">No data</text>

  <line x1="1068" y1="386" x2="1068" y2="430" style="stroke: var(--line)" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Monitoring server -->
  <rect class="card" x="880" y="430" width="376" height="196" rx="12"/>
  <g class="ico">
    <rect x="900" y="470" width="58" height="132" rx="6"/>
    <path d="M900 514 h58 M900 558 h58"/>
  </g>
  <circle cx="912" cy="492" r="3" class="ok"/><circle cx="912" cy="536" r="3" class="ok"/><circle cx="912" cy="580" r="3" class="ok"/>
  <text x="900" y="456" font-size="15" class="h">monitoring server</text>
  <text x="1040" y="456" font-size="12.5" class="muted">one small VPS · the only public IP</text>
  <g font-size="12.5" class="mono">
    <rect class="chip" x="978" y="472" width="126" height="30" rx="6"/><text x="992" y="491">Prometheus</text>
    <rect class="chip" x="1114" y="472" width="126" height="30" rx="6"/><text x="1128" y="491">Grafana</text>
    <rect class="chip" x="978" y="510" width="126" height="30" rx="6"/><text x="992" y="529">Ansible</text>
    <rect class="chip" x="1114" y="510" width="126" height="30" rx="6"/><text x="1128" y="529">WireGuard hub</text>
  </g>
  <text x="978" y="568" font-size="12" class="muted mono">xray-pwc-net 10.213.97.0/24</text>
  <text x="978" y="590" font-size="12" class="muted">reaches each probe back</text>
  <text x="978" y="606" font-size="12" class="muted">through its own tunnel</text>
</svg>
