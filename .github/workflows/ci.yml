# Every push and pull request: the tests, and a dev build of everything a
# release has (bundles and the image, per CPU type, on its own runner), pushed
# nowhere. The same make targets as on a developer's machine.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: xray-pwc-connect/go.mod
          cache-dependency-path: |
            xray-pwc-connect/go.sum
            xray-pwc-aio/aio-net/go.sum
      - uses: astral-sh/setup-uv@v6
      - run: make test

  build:
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: xray-pwc-connect/go.mod
          cache-dependency-path: xray-pwc-connect/go.sum
      - uses: astral-sh/setup-uv@v6
      - uses: docker/setup-buildx-action@v3
      - run: sudo apt-get install -y --no-install-recommends zstd
      - run: make bundle ARCHES=${{ matrix.arch }}
      - run: make image ARCH=${{ matrix.arch }} IMAGE_OUTPUT=type=cacheonly IMAGE_TAGS=
